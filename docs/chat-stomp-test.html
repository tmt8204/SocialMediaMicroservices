<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Chat STOMP Test</title>
  <script src="https://cdn.jsdelivr.net/npm/@stomp/stompjs@7.2.0/bundles/stomp.umd.min.js"></script>
  <style>
    body {
      font-family: Consolas, "Courier New", monospace;
      max-width: 1100px;
      margin: 24px auto;
      padding: 0 16px;
      background: #f6f7fb;
      color: #1f2937;
    }
    h1 {
      font-size: 24px;
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 16px;
    }
    .card {
      background: #ffffff;
      border: 1px solid #dbe1ea;
      border-radius: 12px;
      padding: 16px;
      box-shadow: 0 4px 12px rgba(15, 23, 42, 0.06);
    }
    label {
      display: block;
      font-size: 12px;
      margin-bottom: 6px;
      color: #475569;
    }
    input, textarea, button {
      width: 100%;
      box-sizing: border-box;
      border-radius: 8px;
      border: 1px solid #cbd5e1;
      padding: 10px 12px;
      font: inherit;
      margin-bottom: 12px;
      background: #fff;
    }
    textarea {
      min-height: 120px;
      resize: vertical;
    }
    button {
      cursor: pointer;
      background: #0f172a;
      color: #fff;
      border: none;
    }
    button.secondary {
      background: #475569;
    }
    .row {
      display: flex;
      gap: 8px;
    }
    .row button {
      margin-bottom: 0;
    }
    pre {
      min-height: 260px;
      max-height: 500px;
      overflow: auto;
      background: #0b1020;
      color: #d1fae5;
      border-radius: 12px;
      padding: 16px;
      margin: 0;
      white-space: pre-wrap;
      word-break: break-word;
    }
  </style>
</head>
<body>
  <h1>Chat STOMP Test</h1>
  <div class="grid">
    <div class="card">
      <label for="wsUrl">WebSocket URL</label>
      <input id="wsUrl" value="ws://localhost:8080/ws/chat">

      <label for="token">Access Token</label>
      <textarea id="token" placeholder="Paste JWT access token here"></textarea>

      <label for="conversationId">Conversation ID</label>
      <input id="conversationId" placeholder="conversationId">

      <label for="messageId">Message ID</label>
      <input id="messageId" placeholder="messageId">

      <div class="row">
        <button id="connectBtn">Connect</button>
        <button id="disconnectBtn" class="secondary">Disconnect</button>
      </div>

      <label for="sendPayload">Send Message Payload</label>
      <textarea id="sendPayload">{
  "conversationId": "",
  "clientMessageId": "cmsg_001",
  "messageType": "TEXT",
  "content": "Hello from browser STOMP client",
  "attachments": []
}</textarea>
      <button id="sendBtn">Send /app/chat.send</button>

      <label for="readPayload">Read Payload</label>
      <textarea id="readPayload">{
  "conversationId": "",
  "messageId": ""
}</textarea>
      <button id="readBtn">Send /app/chat.read</button>

      <label for="typingPayload">Typing Payload</label>
      <textarea id="typingPayload">{
  "conversationId": "",
  "typing": true
}</textarea>
      <button id="typingBtn">Send /app/chat.typing</button>
    </div>

    <div class="card">
      <label>Logs</label>
      <pre id="logs"></pre>
    </div>
  </div>

  <script>
    const logs = document.getElementById('logs');
    let client = null;

    function log(message, payload) {
      const line = `[${new Date().toLocaleTimeString()}] ${message}`;
      logs.textContent += payload ? `${line}\n${payload}\n\n` : `${line}\n`;
      logs.scrollTop = logs.scrollHeight;
    }

    function safeJsonText(textareaId) {
      const value = document.getElementById(textareaId).value;
      return JSON.stringify(JSON.parse(value));
    }

    function fillConversationAwarePayloads() {
      const conversationId = document.getElementById('conversationId').value;
      const messageId = document.getElementById('messageId').value;

      if (conversationId) {
        document.getElementById('sendPayload').value = JSON.stringify({
          conversationId,
          clientMessageId: 'cmsg_001',
          messageType: 'TEXT',
          content: 'Hello from browser STOMP client',
          attachments: []
        }, null, 2);

        document.getElementById('readPayload').value = JSON.stringify({
          conversationId,
          messageId
        }, null, 2);

        document.getElementById('typingPayload').value = JSON.stringify({
          conversationId,
          typing: true
        }, null, 2);
      }
    }

    document.getElementById('conversationId').addEventListener('input', fillConversationAwarePayloads);
    document.getElementById('messageId').addEventListener('input', fillConversationAwarePayloads);

    document.getElementById('connectBtn').addEventListener('click', () => {
      const wsUrl = document.getElementById('wsUrl').value.trim();
      const token = document.getElementById('token').value.trim();

      if (!wsUrl || !token) {
        log('Missing wsUrl or token');
        return;
      }

      client = new StompJs.Client({
        brokerURL: wsUrl,
        connectHeaders: {
          Authorization: `Bearer ${token}`
        },
        reconnectDelay: 0,
        debug: (msg) => log(`DEBUG ${msg}`),
        onConnect: () => {
          log('CONNECTED');
          client.subscribe('/user/queue/messages', (message) => log('MESSAGE /user/queue/messages', message.body));
          client.subscribe('/user/queue/events', (message) => log('EVENT /user/queue/events', message.body));
          client.subscribe('/user/queue/errors', (message) => log('ERROR /user/queue/errors', message.body));

          const conversationId = document.getElementById('conversationId').value.trim();
          if (conversationId) {
            client.subscribe(`/topic/conversations/${conversationId}`, (message) => {
              log(`TOPIC /topic/conversations/${conversationId}`, message.body);
            });
          }
        },
        onStompError: (frame) => {
          log(`STOMP ERROR ${frame.headers['message'] || ''}`, frame.body || '');
        },
        onWebSocketError: (event) => {
          log('WEBSOCKET ERROR', JSON.stringify(event));
        },
        onDisconnect: () => log('DISCONNECTED')
      });

      client.activate();
    });

    document.getElementById('disconnectBtn').addEventListener('click', async () => {
      if (client) {
        await client.deactivate();
        client = null;
      }
    });

    document.getElementById('sendBtn').addEventListener('click', () => {
      if (!client || !client.connected) {
        log('Client is not connected');
        return;
      }
      const payload = safeJsonText('sendPayload');
      client.publish({ destination: '/app/chat.send', body: payload });
      log('SENT /app/chat.send', payload);
    });

    document.getElementById('readBtn').addEventListener('click', () => {
      if (!client || !client.connected) {
        log('Client is not connected');
        return;
      }

      const payloadText = document.getElementById('readPayload').value;
      const payloadObject = JSON.parse(payloadText);
      if (!payloadObject.conversationId) {
        log('Read payload is missing conversationId');
        return;
      }

      const payload = safeJsonText('readPayload');
      client.publish({ destination: '/app/chat.read', body: payload });
      log('SENT /app/chat.read', payload);
    });

    document.getElementById('typingBtn').addEventListener('click', () => {
      if (!client || !client.connected) {
        log('Client is not connected');
        return;
      }
      const payload = safeJsonText('typingPayload');
      client.publish({ destination: '/app/chat.typing', body: payload });
      log('SENT /app/chat.typing', payload);
    });
  </script>
</body>
</html>
