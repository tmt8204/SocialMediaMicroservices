spring.application.name=social-media-admin-service
server.port=8087

# MongoDB (users, roles, audit_logs)
spring.mongodb.uri=${MONGO_ADMIN_URI:mongodb://localhost:27017/socialmediaadmindb}

# SQL Server (posts, comments, communities)
spring.datasource.url=${SOCIAL_SQLSERVER_URL:jdbc:sqlserver://localhost:1433;databaseName=SocialMediaDB;encrypt=true;trustServerCertificate=true}
spring.datasource.username=${SOCIAL_DB_USERNAME:abc}
spring.datasource.password=${SOCIAL_DB_PASSWORD:123456}
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver

# JPA
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.SQLServerDialect

# CORS
app.cors.allowed-origin=${APP_CORS_ALLOWED_ORIGIN:http://localhost:3000}

# Rate limiting
admin.rate-limit.max-requests=100
admin.rate-limit.window-seconds=60
