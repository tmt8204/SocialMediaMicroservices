spring.application.name=social-media-auth-service

# Server configuration
server.port=8081

# MongoDB configuration
spring.mongodb.uri=mongodb://localhost:27017/socialmediaauthdb

# JWT configuration (replace secret with a secure Base64-encoded 256-bit key in production)
jwt.secret=c29jaWFsLW1lZGlhLWF1dGgtc2VydmljZS1zZWNyZXQ=
jwt.access-token-expiration-ms=600000
jwt.refresh-token-expiration-ms=259200000

# MailTrap SMTP configuration
spring.mail.host=sandbox.smtp.mailtrap.io
spring.mail.port=2525
spring.mail.username=ee25ef6c3040cc
spring.mail.password=5b4c51624115a6
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true

# Password reset token expiration (milliseconds) - 15 minutes
app.reset-password-token-expiration-ms=900000

# Base URL for reset password link
app.frontend-url=http://localhost:3000
app.cors.allowed-origin=${APP_CORS_ALLOWED_ORIGIN:http://localhost:*}
app.auth.refresh-cookie.name=${APP_AUTH_REFRESH_COOKIE_NAME:refresh_token}
app.auth.refresh-cookie.path=${APP_AUTH_REFRESH_COOKIE_PATH:/api/auth}
app.auth.refresh-cookie.secure=${APP_AUTH_REFRESH_COOKIE_SECURE:false}
app.auth.refresh-cookie.same-site=${APP_AUTH_REFRESH_COOKIE_SAME_SITE:Lax}

# Kafka configuration
spring.kafka.bootstrap-servers=localhost:9092
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer
spring.kafka.topic.create-profile=auth.user.created
