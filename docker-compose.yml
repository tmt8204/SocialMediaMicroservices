services:
  kafka:
    image: apache/kafka:4.0.0
    container_name: kafka
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    ports:
      - "9092:9092"
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'echo > /dev/tcp/127.0.0.1/9092'"]
      interval: 10s
      timeout: 5s
      retries: 12
    networks:
      - social-net

  auth-service-social-media:
    build:
      context: ./auth-service-social-media
      dockerfile: Dockerfile
    container_name: auth-service-social-media
    depends_on:
      kafka:
        condition: service_healthy
    environment:
      KAFKA_BOOTSTRAP_SERVERS: ${KAFKA_BOOTSTRAP_SERVERS:-kafka:9092}
      MONGO_AUTH_URI: ${MONGO_AUTH_URI:-mongodb://host.docker.internal:27017/socialmediaauthdb}
      JWT_SECRET: ${JWT_SECRET:-c29jaWFsLW1lZGlhLWF1dGgtc2VydmljZS1zZWNyZXQ=}
      APP_CORS_ALLOWED_ORIGIN: ${APP_CORS_ALLOWED_ORIGIN:-http://localhost:3000,http://localhost:5173}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:3000}
      MAIL_HOST: ${MAIL_HOST:-sandbox.smtp.mailtrap.io}
      MAIL_PORT: ${MAIL_PORT:-2525}
      MAIL_USERNAME: ${MAIL_USERNAME:-ee25ef6c3040cc}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-5b4c51624115a6}
      BOOTSTRAP_ADMIN_USERNAME: ${BOOTSTRAP_ADMIN_USERNAME:-superadmin}
      BOOTSTRAP_ADMIN_EMAIL: ${BOOTSTRAP_ADMIN_EMAIL:-superadmin@gummynetwork.local}
      BOOTSTRAP_ADMIN_PASSWORD: ${BOOTSTRAP_ADMIN_PASSWORD:-Admin@123}
      BOOTSTRAP_ADMIN_FULL_NAME: ${BOOTSTRAP_ADMIN_FULL_NAME:-Super Admin}
    networks:
      - social-net

  social-media-user-service:
    build:
      context: ./social-media-user-service
      dockerfile: Dockerfile
    container_name: social-media-user-service
    depends_on:
      kafka:
        condition: service_healthy
      auth-service-social-media:
        condition: service_started
    environment:
      KAFKA_BOOTSTRAP_SERVERS: ${KAFKA_BOOTSTRAP_SERVERS:-kafka:9092}
      MONGO_USER_URI: ${MONGO_USER_URI:-mongodb://host.docker.internal:27017/socialmediauserdb}
    networks:
      - social-net

  social-media-social-service:
    build:
      context: ./social-media-social-service
      dockerfile: Dockerfile
    container_name: social-media-social-service
    depends_on:
      kafka:
        condition: service_healthy
      social-media-user-service:
        condition: service_started
      social-media-media-service:
        condition: service_started
    environment:
      KAFKA_BOOTSTRAP_SERVERS: ${KAFKA_BOOTSTRAP_SERVERS:-kafka:9092}
      SOCIAL_SQLSERVER_URL: ${SOCIAL_SQLSERVER_URL:-jdbc:sqlserver://host.docker.internal:1433;databaseName=SocialMediaDB;encrypt=true;trustServerCertificate=true}
      SOCIAL_DB_USERNAME: ${SOCIAL_DB_USERNAME:-abc}
      SOCIAL_DB_PASSWORD: ${SOCIAL_DB_PASSWORD:-123456}
      USER_SERVICE_URL: http://social-media-user-service:8082
      MEDIA_SERVICE_URL: http://social-media-media-service:8084
    networks:
      - social-net

  social-media-media-service:
    build:
      context: ./social-media-media-service
      dockerfile: Dockerfile
    container_name: social-media-media-service
    environment:
      MONGO_MEDIA_URI: ${MONGO_MEDIA_URI:-mongodb://host.docker.internal:27017/socialmediamediadb}
      CLOUDINARY_CLOUD_NAME: ${CLOUDINARY_CLOUD_NAME:-dyztb8qbg}
      CLOUDINARY_API_KEY: ${CLOUDINARY_API_KEY:-556587123654154}
      CLOUDINARY_API_SECRET: ${CLOUDINARY_API_SECRET:-wwgUrat5vbkenPIjPDPPjtQTxy0}
    networks:
      - social-net

  social-media-chat-service:
    build:
      context: ./social-media-chat-service
      dockerfile: Dockerfile
    container_name: social-media-chat-service
    depends_on:
      kafka:
        condition: service_healthy
      social-media-user-service:
        condition: service_started
      social-media-media-service:
        condition: service_started
      social-media-notification-service:
        condition: service_started
    environment:
      KAFKA_BOOTSTRAP_SERVERS: ${KAFKA_BOOTSTRAP_SERVERS:-kafka:9092}
      CHAT_MONGO_URI: ${CHAT_MONGO_URI:-mongodb://host.docker.internal:27017/socialmediachatdb}
      JWT_SECRET: ${JWT_SECRET:-c29jaWFsLW1lZGlhLWF1dGgtc2VydmljZS1zZWNyZXQ=}
      USER_SERVICE_URL: http://social-media-user-service:8082
      MEDIA_SERVICE_URL: http://social-media-media-service:8084
      NOTIFICATION_SERVICE_URL: http://social-media-notification-service:8086
      CHAT_WEBSOCKET_ALLOWED_ORIGINS: ${CHAT_WEBSOCKET_ALLOWED_ORIGINS:-http://localhost:3000,http://localhost:5173}
    networks:
      - social-net

  social-media-notification-service:
    build:
      context: ./social-media-notification-service
      dockerfile: Dockerfile
    container_name: social-media-notification-service
    depends_on:
      kafka:
        condition: service_healthy
    environment:
      KAFKA_BOOTSTRAP_SERVERS: ${KAFKA_BOOTSTRAP_SERVERS:-kafka:9092}
      MONGO_NOTIFICATION_URI: ${MONGO_NOTIFICATION_URI:-mongodb://host.docker.internal:27017/socialmedianotificationdb}
    networks:
      - social-net

  social-media-admin-service:
    build:
      context: ./social-media-admin-service
      dockerfile: Dockerfile
    container_name: social-media-admin-service
    depends_on:
      social-media-social-service:
        condition: service_started
    environment:
      MONGO_ADMIN_URI: ${MONGO_ADMIN_URI:-mongodb://host.docker.internal:27017/socialmediaadmindb}
      SOCIAL_SQLSERVER_URL: ${SOCIAL_SQLSERVER_URL:-jdbc:sqlserver://host.docker.internal:1433;databaseName=SocialMediaDB;encrypt=true;trustServerCertificate=true}
      SOCIAL_DB_USERNAME: ${SOCIAL_DB_USERNAME:-abc}
      SOCIAL_DB_PASSWORD: ${SOCIAL_DB_PASSWORD:-123456}
      APP_CORS_ALLOWED_ORIGIN: ${APP_CORS_ALLOWED_ORIGIN:-http://localhost:3000,http://localhost:5173}
    networks:
      - social-net

  social-media-api-gateway:
    build:
      context: ./social-media-api-gateway
      dockerfile: Dockerfile
    container_name: social-media-api-gateway
    depends_on:
      auth-service-social-media:
        condition: service_started
      social-media-user-service:
        condition: service_started
      social-media-social-service:
        condition: service_started
      social-media-media-service:
        condition: service_started
      social-media-chat-service:
        condition: service_started
      social-media-notification-service:
        condition: service_started
      social-media-admin-service:
        condition: service_started
    environment:
      MONGO_GATEWAY_URI: ${MONGO_GATEWAY_URI:-mongodb://host.docker.internal:27017/socialmediaauthdb}
      JWT_SECRET: ${JWT_SECRET:-c29jaWFsLW1lZGlhLWF1dGgtc2VydmljZS1zZWNyZXQ=}
      AUTH_SERVICE_URL: http://auth-service-social-media:8081
      USER_SERVICE_URL: http://social-media-user-service:8082
      SOCIAL_SERVICE_URL: http://social-media-social-service:8083
      MEDIA_SERVICE_URL: http://social-media-media-service:8084
      CHAT_SERVICE_URL: http://social-media-chat-service:8085
      CHAT_SERVICE_WS_URL: ws://social-media-chat-service:8085
      NOTIFICATION_SERVICE_URL: http://social-media-notification-service:8086
      ADMIN_SERVICE_URL: http://social-media-admin-service:8087
      AUTH_INTROSPECTION_URL: http://auth-service-social-media:8081/api/auth/introspect
    ports:
      - "8080:8080"
    networks:
      - social-net

networks:
  social-net:
    driver: bridge
