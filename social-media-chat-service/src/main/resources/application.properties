spring.application.name=social-media-chat-service
server.port=8085

spring.mongodb.uri=${CHAT_MONGO_URI:mongodb://localhost:27017/socialmediachatdb}
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.kafka.producer.acks=all
spring.kafka.producer.retries=10
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer
spring.kafka.consumer.enable-auto-commit=false
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.properties.spring.json.trusted.packages=com.socialmedia.social_media_chat_service.event
spring.kafka.listener.ack-mode=manual
chat.kafka.topics.message-events=chat-message-events
chat.kafka.topics.read-events=chat-read-events
chat.kafka.topics.notification-events=chat-notification-events
chat.kafka.topics.dead-letter=chat-dead-letter

chat.kafka.instance-id=${CHAT_INSTANCE_ID:${random.uuid}}
chat.kafka.realtime-fanout-group=chat-realtime-fanout-group
chat.kafka.notification-audit-group=chat-notification-audit-group

jwt.secret=${JWT_SECRET:c29jaWFsLW1lZGlhLWF1dGgtc2VydmljZS1zZWNyZXQ=}

services.user-service-url=${USER_SERVICE_URL:http://localhost:8082}
services.media-service-url=${MEDIA_SERVICE_URL:http://localhost:8084}
services.notification-service-url=${NOTIFICATION_SERVICE_URL:http://localhost:8086}

chat.websocket.allowed-origins=${CHAT_WEBSOCKET_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173}

